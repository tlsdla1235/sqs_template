services:
  postgres:
    image: postgres:16-alpine
    container_name: sqs-study-postgres
    environment:
      POSTGRES_DB: sqs_study
      POSTGRES_USER: sqs_user
      POSTGRES_PASSWORD: sqs_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqs_user -d sqs_study"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8.1
    container_name: sqs-study-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-northeast-2
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:latest
    container_name: sqs-study-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: sqs-study-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  localstack-data:
  grafana-data:
